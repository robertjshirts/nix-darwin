# Bind keys for select mode to vi defaults
setw -g mode-keys vi
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe 'pbcopy'
bind-key -T copy-mode-vi 'Enter' send-keys -X copy-pipe-and-cancel 'pbcopy'

# Mouse support
set -g mouse on
bind-key -T copy-mode-vi WheelUpPane send -N3 -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send -N3 -X scroll-down

set -sg escape-time 10
set -s extended-keys on
set -as terminal-features 'ghostty*:extkeys'

# Open splits in current pane's path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Bind pane changing to prefix hjkl
bind-key -r -T prefix k      select-pane -U
bind-key -r -T prefix j    select-pane -D
bind-key -r -T prefix h    select-pane -L
bind-key -r -T prefix l   select-pane -R

# Tell processes when they lose focus
set -g focus-events on

# Change status bar
set -g status-left-length 41
set -g status-right-length 41
set -g status-left ' #{p40:#{=-40:#{s|#{HOME}|~|:pane_current_path}}}'
set -g status-justify absolute-centre
set -g status-right '#{p-40:#{=40:session_name}} '
